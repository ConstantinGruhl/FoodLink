services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: foodlink
      POSTGRES_PASSWORD: foodlink
      POSTGRES_DB: foodlink
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U foodlink -d foodlink" ]
      interval: 5s
      timeout: 5s
      retries: 10
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      PORT: 8080
      CORS_ORIGIN: http://localhost:5173,http://localhost
      DATABASE_URL: postgres://foodlink:foodlink@db:5432/foodlink
      # REMOVE the old volume mount of init.sql here (no longer needed)
      S3_REGION: us-east-1
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH: "true"
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345
      S3_BUCKET: foodlink
      S3_PUBLIC_BASE_URL: http://localhost:9000/foodlink
      S3_ACL_PUBLIC: "true"
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=/api

volumes:
  dbdata:
  miniodata:
