name: foodlink

x-backend-environment: &backend-environment
  NODE_ENV: development
  DEMO_LOGIN_ENABLED: ${DEMO_LOGIN_ENABLED:-true}
  PORT: 8080
  TRUST_PROXY: 1
  DATABASE_URL: postgres://foodlink:foodlink@db:5432/foodlink
  APP_ORIGIN: http://localhost:5173,http://127.0.0.1:5173
  PUBLIC_APP_URL: http://localhost:5173
  COOKIE_SECURE: 'false'
  MIGRATE_ON_START: 'true'
  S3_REGION: us-east-1
  S3_ENDPOINT: http://minio:9000
  S3_FORCE_PATH: 'true'
  S3_ACCESS_KEY: minio
  S3_SECRET_KEY: minio12345
  S3_BUCKET: foodlink
  AUTO_CREATE_BUCKET: 'true'
  MAIL_MODE: smtp
  SMTP_HOST: mailpit
  SMTP_PORT: 1025
  SMTP_SECURE: 'false'
  MAIL_FROM: FoodLink <noreply@foodlink.local>
  PAYMENTS_ENABLED: 'false'
  ORGANIZATION_NAME: FoodLink local prototype

services:
  db:
    image: postgres:16.15@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    restart: unless-stopped
    environment:
      POSTGRES_USER: foodlink
      POSTGRES_PASSWORD: foodlink
      POSTGRES_DB: foodlink
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U foodlink -d foodlink']
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    # Development only. Production uses a maintained private S3 service.
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:9000/minio/health/live]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit@sha256:98b916bd3c8d61f7633a52d3ea2f58d00620cb01ca57ab59edde68c347a95365
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 1000
      MP_DISABLE_VERSION_CHECK: 'true'
    ports:
      - '127.0.0.1:8025:8025'
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: foodlink-backend:local
    build: ./backend
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      db: { condition: service_healthy }
      minio: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    environment: *backend-environment
    ports:
      - '127.0.0.1:8080:8080'

  frontend:
    image: foodlink-frontend:local
    build: ./frontend
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      backend: { condition: service_healthy }
    ports:
      - '127.0.0.1:5173:8080'

  seed:
    image: foodlink-backend:local
    profiles: [tools]
    command: [node, dist/seed.js]
    environment:
      <<: *backend-environment
      SEED_DEMO: 'true'
      DEMO_PASSWORD: ${DEMO_PASSWORD:-FoodLink-demo-2026!}
    depends_on:
      backend: { condition: service_healthy }

volumes:
  # Keep these names: upgrades preserve the existing development volumes.
  dbdata:
  miniodata:
